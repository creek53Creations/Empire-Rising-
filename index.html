<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1427"><link rel="manifest" href="manifest.webmanifest"><title>Empire Rising — City Tycoon</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#e9f3ff;background:#0b1427}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.app{max-width:1050px;margin:auto;padding:14px 14px 100px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.logo{font-weight:900;font-size:22px}.muted{color:#9cb2ce;font-size:13px}.money{font-size:27px;font-weight:900;color:#7ef2ad}.panel{background:#15233a;border:1px solid #2b405e;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 8px 30px #0002}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#1b2c46;padding:12px;border-radius:13px}.stat strong{display:block;font-size:18px}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:5px;padding:9px max(9px,env(safe-area-inset-right)) calc(9px + env(safe-area-inset-bottom));background:#0d192deF;backdrop-filter:blur(14px);border-top:1px solid #29415e;z-index:5}.tabs button{border:0;background:transparent;color:#9fb6d0;padding:9px 13px;border-radius:12px;font-size:12px}.tabs button.active{background:#294c78;color:white}.btn{border:0;background:#36c58a;color:#08251c;padding:10px 13px;border-radius:11px;font-weight:800;margin:3px}.btn.alt{background:#294b75;color:#e8f2ff}.btn.warn{background:#e5ae59;color:#271905}.btn.small{font-size:12px;padding:8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:12px}.biz{background:#1a2b45;border:1px solid #314a6b;border-radius:15px;padding:13px}.biz h3{margin:0 0 4px}.bar{height:8px;background:#30425d;border-radius:20px;overflow:hidden;margin:8px 0}.fill{height:100%;background:#41d4aa;transition:width .3s}.city{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;background:linear-gradient(135deg,#254f57,#263c55);border:5px solid #263d51;border-radius:20px;padding:12px}.lot{height:130px;background:#314f5a;border:2px dashed #68828a;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:5px;padding:7px;position:relative}.lot.owned{background:linear-gradient(160deg,#325b72,#243c61);border:2px solid #78a8c0}.building{font-size:40px;filter:drop-shadow(0 5px 2px #0004)}.people{font-size:18px;min-height:24px;animation:bob 1.3s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-5px)}}.lot button{background:#112b43;color:#fff;border:1px solid #60869d;border-radius:8px;padding:5px;font-size:11px}.notice{background:#284466;border-radius:12px;padding:11px;margin:9px 0}.good{color:#8ff3bb}.bad{color:#ffac9e}h2{margin:3px 0 11px}h3{margin:8px 0}.actions{display:flex;flex-wrap:wrap;gap:4px}.tag{background:#284364;color:#cce8ff;border-radius:20px;padding:4px 8px;font-size:11px;display:inline-block}.log{max-height:160px;overflow:auto}.log div{border-bottom:1px solid #30445f;padding:7px 0;font-size:13px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.row>*{min-width:0}.hide{display:none}input{background:#0d1b30;border:1px solid #526989;color:white;border-radius:9px;padding:10px;max-width:100%}@media(max-width:500px){.app{padding:10px 10px 94px}.tabs button{padding:9px 8px;font-size:11px}.city{gap:5px;padding:7px}.lot{height:115px}.building{font-size:32px}.stats{gap:5px}.stat{padding:8px}.stat strong{font-size:15px}}
</style></head><body><div class="app"><header class="top"><div><div class="logo">🏙️ EMPIRE RISING</div><div class="muted">CITY TYCOON • OFFLINE EDITION</div></div><div><div class="muted">Available cash</div><div class="money" id="cash">$0</div></div></header><div class="stats"><div class="stat"><span class="muted">Net worth</span><strong id="worth">$0</strong></div><div class="stat"><span class="muted">Profit / sec</span><strong id="rate">$0</strong></div><div class="stat"><span class="muted">Reputation</span><strong id="rep">0 ⭐</strong></div></div><div id="alert"></div><main id="view"></main></div><nav class="tabs" id="tabs"></nav><script>
(()=>{'use strict';
const DATA=[{name:'Corner Café',emoji:'☕',cost:0,price:15,stock:2,service:3},{name:'Mini Market',emoji:'🏪',cost:450,price:32,stock:6,service:5},{name:'Pizza Kitchen',emoji:'🍕',cost:2200,price:65,stock:14,service:8},{name:'Car Wash',emoji:'🚘',cost:10500,price:140,stock:30,service:12},{name:'Fitness Club',emoji:'🏋️',cost:49000,price:310,stock:65,service:17},{name:'Tech Store',emoji:'💻',cost:210000,price:720,stock:150,service:24},{name:'Hotel',emoji:'🏨',cost:950000,price:1750,stock:380,service:34},{name:'Luxury Mall',emoji:'🏬',cost:4500000,price:4100,stock:900,service:50},{name:'Global HQ',emoji:'🏙️',cost:22000000,price:11000,stock:2400,service:75}];
const KEY='empire-rising-city-v2';const blank=()=>({cash:350,rep:1,total:0,last:Date.now(),selected:0,tab:'city',businesses:DATA.map((x,i)=>({owned:i===0,level:1,staff:i===0?1:0,capacity:20,inventory:i===0?12:0,served:0,progress:0,marketing:0})),contracts:[],logs:['Welcome to Empire Rising! Manage your café, stock supplies, and grow your city.'],research:0,bonus:1});let s;try{s=Object.assign(blank(),JSON.parse(localStorage.getItem(KEY)||'null')||{});if(!Array.isArray(s.businesses)||s.businesses.length!==DATA.length)throw Error('bad')}catch{s=blank()};let offline=0;const fmt=n=>'$'+(n>=1e9?(n/1e9).toFixed(2)+'B':n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':Math.floor(n).toLocaleString());const cost=(i,type)=>{let b=s.businesses[i],d=DATA[i];return type==='staff'?Math.ceil(d.price*12*Math.pow(1.65,b.staff)):type==='level'?Math.ceil(d.price*18*Math.pow(1.8,b.level-1)):type==='capacity'?Math.ceil(d.price*9*Math.pow(1.55,(b.capacity-20)/10)):Math.ceil(d.price*35*Math.pow(2,b.marketing))};const unit=i=>DATA[i].price*(1+.25*(s.businesses[i].level-1))*(1+s.research*.1)*s.bonus;const speed=i=>Math.max(1,DATA[i].service/(1+s.businesses[i].marketing*.28));const demand=i=>Math.min(1,(.18+s.businesses[i].staff*.2+s.rep*.005));const rate=i=>{let b=s.businesses[i];return b.owned&&b.staff>0&&b.inventory>0?unit(i)*Math.min(b.staff,3)*demand(i)/speed(i):0};const log=t=>{s.logs.unshift(new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+' · '+t);s.logs=s.logs.slice(0,35)};const save=()=>{s.last=Date.now();try{localStorage.setItem(KEY,JSON.stringify(s))}catch{}};const toast=t=>{document.getElementById('alert').innerHTML='<div class="notice">'+t+'</div>';setTimeout(()=>{let el=document.getElementById('alert');if(el)el.innerHTML=''},4000)};
function simulate(sec,away=false){sec=Math.max(0,Math.min(sec,28800));let gained=0;for(let i=0;i<DATA.length;i++){let b=s.businesses[i];if(!b.owned||!b.staff||!b.inventory)continue;let possible=Math.floor((b.progress+sec*Math.min(b.staff,3)*demand(i))/speed(i));let sold=Math.min(b.inventory,possible);b.inventory-=sold;b.served+=sold;b.progress=(b.progress+sec*Math.min(b.staff,3)*demand(i))-possible*speed(i);b.progress=Math.max(0,b.progress);gained+=sold*unit(i)}s.cash+=gained;s.total+=gained;if(away)offline=gained;return gained}
let elapsed=(Date.now()-s.last)/1000;if(elapsed>15){simulate(elapsed,true);if(offline)log('Offline sales earned '+fmt(offline))}save();
function act(type,i){let b=s.businesses[i],d=DATA[i];if(type==='select'){s.selected=i;s.tab='manage';render();return}if(type==='buy'){if(s.cash<d.cost)return;s.cash-=d.cost;b.owned=true;b.staff=1;b.inventory=10;s.rep+=3;log('Opened '+d.name)}if(type==='stock'){let amount=Math.min(b.capacity-b.inventory,10);let price=amount*d.stock;if(amount<=0)return toast('Storage is full.');if(s.cash<price)return toast('Not enough cash for supplies.');s.cash-=price;b.inventory+=amount;log('Restocked '+d.name+' ('+amount+' units)')}if(['staff','level','capacity','marketing'].includes(type)){let price=cost(i,type);if(s.cash<price)return toast('Not enough cash.');s.cash-=price;if(type==='staff')b.staff++;if(type==='level')b.level++;if(type==='capacity')b.capacity+=10;if(type==='marketing')b.marketing++;log(d.name+': '+type+' upgraded')}if(type==='promo'){if(s.cash<100)return toast('Need $100 to advertise.');s.cash-=100;s.rep+=2;log('Local advertising boosted your reputation')}save();render()}
function panelBiz(i){let b=s.businesses[i],d=DATA[i];if(!b.owned)return `<div class="biz"><h3>${d.emoji} ${d.name}</h3><p class="muted">Unlock a new revenue stream and expand your city.</p><button class="btn" ${s.cash<d.cost?'disabled':''} onclick="game('buy',${i})">Open • ${fmt(d.cost)}</button></div>`;return `<div class="biz"><div class="row"><h3>${d.emoji} ${d.name}</h3><span class="tag">Lv ${b.level}</span></div><div class="muted">${b.staff} employees · ${fmt(rate(i))}/sec potential</div><div class="row"><small>Supplies ${b.inventory}/${b.capacity}</small><small>${b.served} sales</small></div><div class="bar"><div class="fill" style="width:${100*b.inventory/b.capacity}%"></div></div><div class="actions"><button class="btn small" onclick="game('stock',${i})">📦 Restock (${fmt(Math.min(10,b.capacity-b.inventory)*d.stock)})</button><button class="btn alt small" onclick="game('select',${i})">⚙️ Manage</button></div></div>`}
function city(){return `<section class="panel"><h2>🌆 Your Business District</h2><p class="muted">Open locations, keep shelves stocked, and watch customers visit. Tap a building to manage it.</p><div class="city">${DATA.map((d,i)=>{let b=s.businesses[i];return `<div class="lot ${b.owned?'owned':''}"><div class="building">${b.owned?d.emoji:'🔒'}</div><strong style="font-size:12px">${d.name}</strong><div class="people">${b.owned&&b.inventory>0?'🚶 🧍':''}</div><button onclick="game('${b.owned?'select':'buy'}',${i})">${b.owned?'Manage':fmt(d.cost)}</button></div>`}).join('')}</div></section><section class="panel"><h2>📊 Your Businesses</h2><div class="grid">${DATA.map((_,i)=>panelBiz(i)).join('')}</div></section>`}
function manage(){let i=s.selected,b=s.businesses[i],d=DATA[i];return `<section class="panel"><h2>⚙️ Business Operations</h2><div class="actions">${DATA.map((d,j)=>s.businesses[j].owned?`<button class="btn ${j===i?'':'alt'} small" onclick="game('select',${j})">${d.emoji} ${d.name}</button>`:'').join('')}</div></section>${panelBiz(i)}<section class="panel"><h2>🏗️ Improve ${d.name}</h2><p class="muted">Hiring improves throughput. Equipment increases revenue per sale. Marketing attracts more customers. Bigger storage reduces stockouts.</p><div class="grid"><div class="biz"><h3>👥 Hire Employees</h3><p>${b.staff} staff members</p><button class="btn" onclick="game('staff',${i})">Hire • ${fmt(cost(i,'staff'))}</button></div><div class="biz"><h3>🛠️ Upgrade Equipment</h3><p>Level ${b.level} · ${fmt(unit(i))} per sale</p><button class="btn" onclick="game('level',${i})">Upgrade • ${fmt(cost(i,'level'))}</button></div><div class="biz"><h3>📦 Expand Storage</h3><p>Capacity: ${b.capacity} units</p><button class="btn" onclick="game('capacity',${i})">Expand • ${fmt(cost(i,'capacity'))}</button></div><div class="biz"><h3>📣 Marketing Campaign</h3><p>Marketing level ${b.marketing}</p><button class="btn" onclick="game('marketing',${i})">Launch • ${fmt(cost(i,'marketing'))}</button></div></div></section>`}
function contracts(){let targets=[{label:'Supply Chain Sprint',detail:'Restock any business 3 times',reward:850,kind:'stock'},{label:'Citywide Brand Campaign',detail:'Spend $100 on local advertising for reputation',reward:0,kind:'promo'},{label:'Investment Research',detail:'Research operational efficiency for a permanent 10% revenue boost',reward:0,kind:'research'}];return `<section class="panel"><h2>📋 CEO Desk</h2><p class="muted">Take active decisions beyond buying upgrades. Your choices influence demand, reputation, and profits.</p><div class="grid">${targets.map(x=>`<div class="biz"><h3>${x.label}</h3><p class="muted">${x.detail}</p><button class="btn ${x.kind==='research'?'warn':''}" onclick="game('${x.kind}',0)">${x.kind==='research'?'Research • '+fmt(5000*(s.research+1)):x.kind==='promo'?'Run Campaign • $100':'Order Bulk Supplies'}</button></div>`).join('')}</div></section><section class="panel"><h2>📈 Operations Report</h2><p>Revenue earned: <strong>${fmt(s.total)}</strong></p><p>Active businesses: <strong>${s.businesses.filter(x=>x.owned).length}/${DATA.length}</strong></p><p>Employees: <strong>${s.businesses.reduce((a,b)=>a+b.staff,0)}</strong></p><p>Research level: <strong>${s.research}</strong></p></section>`}
function settings(){return `<section class="panel"><h2>💾 Save & Settings</h2><p class="muted">Progress is stored in this browser. Export a backup before clearing browser data or changing devices.</p><div class="actions"><button class="btn" onclick="game('export',0)">Export Save</button><button class="btn alt" onclick="document.getElementById('import').click()">Import Save</button><input id="import" type="file" accept="application/json" class="hide" onchange="window.importSave(this)"><button class="btn warn" onclick="game('reset',0)">New Game</button></div></section><section class="panel"><h2>📰 Activity Log</h2><div class="log">${s.logs.map(x=>`<div>${x.replaceAll('<','&lt;')}</div>`).join('')}</div></section>`}
function render(){document.getElementById('cash').textContent=fmt(s.cash);document.getElementById('worth').textContent=fmt(s.cash+s.businesses.reduce((a,b,i)=>a+(b.owned?DATA[i].cost+b.level*DATA[i].price*10:0),0));document.getElementById('rate').textContent=fmt(DATA.reduce((a,_,i)=>a+rate(i),0));document.getElementById('rep').textContent=s.rep+' ⭐';document.getElementById('tabs').innerHTML=[['city','🏙️ City'],['manage','🏢 Manage'],['desk','📋 CEO Desk'],['settings','⚙️ More']].map(([key,label])=>`<button class="${s.tab===key?'active':''}" onclick="nav('${key}')">${label}</button>`).join('');document.getElementById('view').innerHTML=s.tab==='city'?city():s.tab==='manage'?manage():s.tab==='desk'?contracts():settings()}
window.nav=t=>{s.tab=t;save();render()};window.game=(type,i)=>{if(type==='research'){let price=5000*(s.research+1);if(s.cash<price)return toast('Research needs '+fmt(price));s.cash-=price;s.research++;s.rep+=5;log('Research improved revenue by 10%');save();render();return}if(type==='export'){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'}));a.download='empire-rising-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);return}if(type==='reset'){if(confirm('Delete this game and start over?')){s=blank();save();render()}return}if(type==='stock'&&s.tab==='desk'){let owned=s.businesses.findIndex(b=>b.owned&&b.inventory<b.capacity);if(owned<0)return toast('All businesses are fully stocked.');act('stock',owned);return}act(type,i)};window.importSave=async el=>{try{let v=JSON.parse(await el.files[0].text());if(!Array.isArray(v.businesses)||v.businesses.length!==DATA.length||!Number.isFinite(v.cash))throw Error();s=v;save();render();toast('Save imported successfully.')}catch{toast('Invalid save file.')}};
setInterval(()=>{simulate(1);render()},1000);setInterval(save,5000);document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else{let gap=(Date.now()-s.last)/1000;if(gap>10){let earned=simulate(gap,true);if(earned)toast('While away, your businesses earned '+fmt(earned));save();render()}}});window.addEventListener('pagehide',save);if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});render();if(offline)toast('Welcome back! Offline sales: '+fmt(offline));
})();</script></body></html>
